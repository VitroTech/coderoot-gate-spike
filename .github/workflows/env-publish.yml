# Per-environment trusted-publishing checks.
#
# Each test package trusts this workflow file in one GitHub environment only:
# @vitrotech/gate-spike-a in cust-a (publish), @vitrotech/gate-spike-b in cust-b
# (stage only), @vitrotech/gate-spike-c in cust-a (publish, restricted access). A dispatch picks the package, the environment and the mode, so
# a run either matches a package's trust configuration or deliberately does not.
#
# `pack` has no publish rights and builds the tarball. The publish job holds the
# OIDC token and only verifies and publishes; nothing is installed, built or
# packed there apart from the pinned npm itself.
#
# With `submit`, the release then goes to CodeRoot for a person's approval:
# flow published after `npm publish`, flow staged after `npm stage publish`.
# `submit` runs in `coderoot-submit`, an environment npm does not trust, so it
# cannot publish; it checks out the private Action itself with a read-only key.

name: env-publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Test package to pack: a, b or c"
        required: true
        type: choice
        options: [a, b, c]
      environment:
        description: "Environment for the publish job (none = no environment)"
        required: true
        type: choice
        options: [cust-a, cust-b, none]
      version:
        description: "Version to publish, e.g. 0.0.1"
        required: true
        type: string
      mode:
        description: "npm publish, npm stage publish, or claims (decode the OIDC token only, no publish)"
        required: true
        type: choice
        options: [publish, stage, claims]
      access:
        description: "npm access for the publish"
        required: false
        default: public
        type: choice
        options: [public, restricted]
      readme-note:
        description: "Optional line appended to the package README, to change the bytes of a version"
        required: false
        default: ""
        type: string
      provenance-source:
        description: "npm: npm makes the provenance at publish. file: the job makes the bundle first and passes it with --provenance-file"
        required: false
        default: npm
        type: choice
        options: [npm, file]
      provenance:
        description: "Publish with --provenance"
        required: false
        default: true
        type: boolean
      submit:
        description: "Submit the release to CodeRoot afterwards (staged needs provenance-source file)"
        required: false
        default: false
        type: boolean
      action-ref:
        description: "coderoot-action ref the submit job runs"
        required: false
        default: v1
        type: string

permissions: {}

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tarball_b64: ${{ steps.pack.outputs.tarball_b64 }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: ""
      - name: Check the submit inputs
        if: ${{ inputs.submit }}
        env:
          MODE: ${{ inputs.mode }}
          ENVIRONMENT: ${{ inputs.environment }}
          PROVENANCE_SOURCE: ${{ inputs.provenance-source }}
        run: |
          set -euo pipefail
          [ "$MODE" != "claims" ] || { echo "submit needs mode publish or stage"; exit 1; }
          [ "$ENVIRONMENT" != "none" ] || { echo "submit needs a publish environment"; exit 1; }
          # A staged release proves itself with the bundle npm attaches, so the job must hold it.
          [ "$MODE" != "stage" ] || [ "$PROVENANCE_SOURCE" = "file" ] || { echo "submit with mode stage needs provenance-source file"; exit 1; }
      - id: pack
        env:
          PKG: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
          NOTE: ${{ inputs.readme-note }}
        run: |
          set -euo pipefail
          case "$VERSION" in (*[!0-9.]*|"") echo "version must be digits and dots"; exit 1;; esac
          case "$NOTE" in (*[!a-z0-9-]*) echo "readme-note: lowercase letters, digits and dashes only"; exit 1;; esac
          cd "packages/$PKG"
          if [ -n "$NOTE" ]; then printf '\n%s\n' "$NOTE" >> README.md; fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version --ignore-scripts >/dev/null
          npm pack --ignore-scripts --pack-destination ../.. >/dev/null
          cd ../..
          mv ./*.tgz package.tgz
          # README-only test packages are small enough for a job output.
          echo "tarball_b64=$(base64 -w0 package.tgz)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 package.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  # A publish job is selected by the environment input. An empty `environment:`
  # value is not guaranteed to mean "no environment", so the no-environment case
  # is its own job with no `environment:` key at all.
  publish:
    if: ${{ inputs.environment != 'none' }}
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      stage_id: ${{ steps.release.outputs.stage_id }}
      bundle_b64: ${{ steps.release.outputs.bundle_b64 }}
    steps:
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: ""
      - name: Exact npm
        run: npm install -g npm@12.2.0 --ignore-scripts && npm --version
      - name: Restore and verify the tarball
        env:
          TB64: ${{ needs.pack.outputs.tarball_b64 }}
          EXPECTED: ${{ needs.pack.outputs.sha256 }}
        run: |
          set -euo pipefail
          echo "$TB64" | base64 -d > package.tgz
          actual="$(shasum -a 256 package.tgz | cut -d' ' -f1)"
          [ "$actual" = "$EXPECTED" ] || { echo "digest mismatch"; exit 1; }
          echo "verified sha256:$actual"
      # With provenance-source file, the bundle npm attaches is made here first, so
      # the job holds the exact file. npm requires one subject: the package's purl
      # with the tarball's SHA-512.
      - name: Provenance subject
        if: ${{ inputs.provenance-source == 'file' && inputs.mode != 'claims' }}
        env:
          PKG: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sha512="$(shasum -a 512 package.tgz | cut -d' ' -f1)"
          printf '%s  pkg:npm/%%40vitrotech/gate-spike-%s@%s\n' "$sha512" "$PKG" "$VERSION" > subject.checksums.txt
          cat subject.checksums.txt
      - name: Make the provenance bundle
        id: attest
        if: ${{ inputs.provenance-source == 'file' && inputs.mode != 'claims' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: subject.checksums.txt
      - name: Keep the bundle
        if: ${{ inputs.provenance-source == 'file' && inputs.mode != 'claims' }}
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" provenance.sigstore.json
          echo "bundle sha256:$(shasum -a 256 provenance.sigstore.json | cut -d' ' -f1)"
          jq -r '.dsseEnvelope.payload' provenance.sigstore.json | base64 -d | jq -c '{subject, predicateType}'
          jq -c '{mediaType, logIndex: .verificationMaterial.tlogEntries[0].logIndex}' provenance.sigstore.json
      # Prints the claims of a token issued to this job, for an audience npm does
      # not accept. The signature is dropped, so the output cannot be replayed.
      - name: Decode OIDC claims (payload only)
        run: |
          set -euo pipefail
          tok="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=coderoot-claims-check" | jq -r .value)"
          p="$(cut -d. -f2 <<<"$tok" | tr '_-' '/+')"
          while [ $(( ${#p} % 4 )) -ne 0 ]; do p="$p="; done
          base64 -d <<<"$p" | jq -S 'del(.jti)'
      - name: Publish or stage
        if: ${{ inputs.mode != 'claims' }}
        env:
          MODE: ${{ inputs.mode }}
          ACCESS: ${{ inputs.access }}
          PROVENANCE: ${{ inputs.provenance }}
          PROVENANCE_SOURCE: ${{ inputs.provenance-source }}
        run: |
          set -euo pipefail
          args=(package.tgz --registry https://registry.npmjs.org/ --access "$ACCESS" --ignore-scripts)
          if [ "$PROVENANCE_SOURCE" = "file" ]; then args+=(--provenance-file provenance.sigstore.json)
          elif [ "$PROVENANCE" = "true" ]; then args+=(--provenance); fi
          # The submit job reads the stage id from this output.
          if [ "$MODE" = "stage" ]; then npm stage publish "${args[@]}" 2>&1 | tee npm-output.txt
          else npm publish "${args[@]}" 2>&1 | tee npm-output.txt; fi
      # Handed to the submit job as job outputs, not an artifact: an artifact in a
      # public repository is downloadable by anyone, including a staged tarball
      # before npm approves it.
      - name: Hand the release to the submit job
        id: release
        if: ${{ inputs.submit && inputs.mode != 'claims' }}
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "stage" ]; then
            stage_id="$(grep -oE 'staged with id [0-9a-f-]{36}' npm-output.txt | awk '{print $4}')"
            [ -n "$stage_id" ] || { echo "no stage id in the npm output"; exit 1; }
            echo "stage_id=$stage_id" >> "$GITHUB_OUTPUT"
            echo "bundle_b64=$(base64 -w0 provenance.sigstore.json)" >> "$GITHUB_OUTPUT"
          fi

  publish-no-environment:
    if: ${{ inputs.environment == 'none' }}
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: ""
      - name: Exact npm
        run: npm install -g npm@12.2.0 --ignore-scripts && npm --version
      - name: Restore and verify the tarball
        env:
          TB64: ${{ needs.pack.outputs.tarball_b64 }}
          EXPECTED: ${{ needs.pack.outputs.sha256 }}
        run: |
          set -euo pipefail
          echo "$TB64" | base64 -d > package.tgz
          actual="$(shasum -a 256 package.tgz | cut -d' ' -f1)"
          [ "$actual" = "$EXPECTED" ] || { echo "digest mismatch"; exit 1; }
          echo "verified sha256:$actual"
      - name: Publish (expected to be refused)
        if: ${{ inputs.mode != 'claims' }}
        env:
          MODE: ${{ inputs.mode }}
          ACCESS: ${{ inputs.access }}
          PROVENANCE: ${{ inputs.provenance }}
        run: |
          set -euo pipefail
          args=(package.tgz --registry https://registry.npmjs.org/ --access "$ACCESS" --ignore-scripts)
          if [ "$PROVENANCE" = "true" ]; then args+=(--provenance); fi
          if [ "$MODE" = "stage" ]; then npm stage publish "${args[@]}"; else npm publish "${args[@]}"; fi

  # `coderoot-submit` allows main only and holds one secret, the read-only key
  # for the private Action. npm trusts this workflow only in cust-a and cust-b,
  # so the identity token here cannot publish. It still names this workflow
  # file, which the workspace link and the release's provenance both match.
  # The Action is checked out in this job and never leaves it: an artifact in a
  # public repository is downloadable by anyone.
  submit:
    if: ${{ inputs.submit }}
    needs: [pack, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: coderoot-submit
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: VitroTech/coderoot-action
          ref: ${{ inputs.action-ref }}
          ssh-key: ${{ secrets.CODEROOT_ACTION_KEY }}
          persist-credentials: false
          path: coderoot-action
      - name: Restore and verify the release
        env:
          TB64: ${{ needs.pack.outputs.tarball_b64 }}
          EXPECTED: ${{ needs.pack.outputs.sha256 }}
          BUNDLE_B64: ${{ needs.publish.outputs.bundle_b64 }}
        run: |
          set -euo pipefail
          mkdir release
          echo "$TB64" | base64 -d > release/package.tgz
          actual="$(shasum -a 256 release/package.tgz | cut -d' ' -f1)"
          [ "$actual" = "$EXPECTED" ] || { echo "digest mismatch"; exit 1; }
          if [ -n "$BUNDLE_B64" ]; then echo "$BUNDLE_B64" | base64 -d > release/provenance.sigstore.json; fi
      - name: Submit to CodeRoot
        id: submit
        uses: ./coderoot-action
        with:
          mode: submit
          flow: ${{ inputs.mode == 'stage' && 'staged' || 'published' }}
          artifact: release/package.tgz
          name: "@vitrotech/gate-spike-${{ inputs.package }}"
          version: ${{ inputs.version }}
          stage-id: ${{ needs.publish.outputs.stage_id }}
          provenance-bundle: ${{ inputs.mode == 'stage' && 'release/provenance.sigstore.json' || '' }}
          submit-endpoint: https://secure.coderoot.app
          note: "env-publish run ${{ github.run_id }}"
