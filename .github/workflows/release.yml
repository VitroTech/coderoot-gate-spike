# Trusted-publisher spike.
#
# Publishes a tarball to npm using npm's trusted publishing (OIDC). There is no
# NPM_TOKEN in this repository, in its secrets, or in this file: npm is told to
# trust *this repo running this workflow file*, and the runner proves that with
# a short-lived OIDC token it requests at publish time.
#
# Trusted publishing removes the stored npm credential, but the runner remains
# a target: code running in this job can access its publishing identity.

name: release

on:
  workflow_dispatch:
    inputs:
      tarball_url:
        description: "HTTPS URL of a tarball to publish. Leave empty to pack ./package."
        required: false
        default: ""
        type: string
      tarball_sha256:
        description: "Expected sha256 of that tarball (required when tarball_url is set)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Resolve and verify, but do not publish"
        required: false
        default: false
        type: boolean
      provenance:
        description: "Publish with --provenance. Requires a PUBLIC repository (npm E422 otherwise)."
        required: false
        default: false
        type: boolean

# Manual dispatch only; no pull-request trigger.
permissions:
  contents: read
  # The single permission trusted publishing needs: request an OIDC token.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # No `environment:` with stored secrets, and no reusable workflow: npm binds
    # trust to this repo + this file path, so indirection widens what is trusted.
    timeout-minutes: 10

    steps:
      # Pinned to a commit SHA, not a tag. A tag is mutable: whoever controls
      # the action's repo can repoint v4 at new code, which then runs inside a
      # job holding a publishable OIDC token.
      - name: Check out (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node (pinned)
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          # No registry-url: this workflow uses trusted publishing rather than
          # token-based npm authentication configuration.
          #
          # No cache either: a poisoned Actions cache is a supply-chain entry
          # point into a job that can publish, and the spike trades ~20s for it.
          cache: ""

      - name: Require npm with trusted publishing support
        run: |
          npm install -g npm@^11.5.1
          echo "npm $(npm --version)"

      # Two sources, one rule: whatever is published must be bytes this job can
      # name by digest before it sends them.
      - name: Pack the repository's package
        if: ${{ inputs.tarball_url == '' }}
        run: |
          set -euo pipefail
          # Pack the local test package. Keep it free of lifecycle scripts:
          # npm pack can execute them inside this OIDC-enabled job.
          npm pack ./package --pack-destination . >/dev/null
          mv ./*.tgz package.tgz
          echo "packed sha256:$(shasum -a 256 package.tgz | cut -d' ' -f1)"

      - name: Fetch the tarball and verify its digest
        if: ${{ inputs.tarball_url != '' }}
        env:
          TARBALL_URL: ${{ inputs.tarball_url }}
          EXPECTED: ${{ inputs.tarball_sha256 }}
        run: |
          set -euo pipefail
          # Values from `inputs` are referenced through the environment, never
          # interpolated into the script body, so a crafted input cannot break
          # out of the string and run as shell.
          case "$TARBALL_URL" in
            https://*) ;;
            *) echo "refusing non-https tarball url"; exit 1 ;;
          esac
          if [ -z "$EXPECTED" ]; then
            echo "refusing a tarball url with no expected digest"; exit 1
          fi

          curl -fsSL --proto '=https' --tlsv1.2 -o package.tgz "$TARBALL_URL"

          expected="${EXPECTED#sha256:}"
          actual="$(shasum -a 256 package.tgz | cut -d' ' -f1)"
          if [ "$expected" != "$actual" ]; then
            echo "digest mismatch"
            echo "  expected $expected"
            echo "  actual   $actual"
            exit 1
          fi
          echo "tarball verified: sha256:$actual"

      # Publish using the package's configured trusted-publisher identity.
      # Explicit --provenance is optional here because npm requires a public
      # source repository for provenance.
      - name: Publish
        if: ${{ !inputs.dry_run }}
        env:
          PROVENANCE: ${{ inputs.provenance }}
        run: |
          set -euo pipefail
          if [ "$PROVENANCE" = "true" ]; then
            npm publish package.tgz --provenance --access public
          else
            npm publish package.tgz --access public
          fi

      - name: Dry run (resolve only)
        if: ${{ inputs.dry_run }}
        env:
          PROVENANCE: ${{ inputs.provenance }}
        run: |
          set -euo pipefail
          if [ "$PROVENANCE" = "true" ]; then
            npm publish package.tgz --provenance --access public --dry-run
          else
            npm publish package.tgz --access public --dry-run
          fi
