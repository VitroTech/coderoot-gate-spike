name: workflow-checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check both publishing workflows
        run: bash scripts/check-workflow.sh
      - name: Check unsafe workflow edits are refused
        run: python3 scripts/test-check-workflow.py
